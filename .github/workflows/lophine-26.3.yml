name: Lophine 26.3 compatibility

on:
  push:
    branches:
      - fix/lophine-26.3-compat
  pull_request:
    branches:
      - fix/lophine-26.3-compat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lophine-26.3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Public verification key from the upstream signed-registry release build.
      # This is a trust root, never a signing key. See the compatibility guide for provenance.
      MAHJONG_RULE_PACK_PUBLIC_KEY_BASE64: MCowBQYDK2VwAyEABKsqAQxbRheenJb5AsClim4f1uuCCrdByfaM5AOxlro=
      # Explicit fork signer for the independently signed Riichi test registry.
      MAHJONG_FORK_RULE_PACK_PUBLIC_KEY_BASE64: MCowBQYDK2VwAyEAwQzKwTZ1wK3f/hkA2mH9cWgDSjaPpzSEYQHvQu7w9mU=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch the pinned official MCR test artifact
        shell: pwsh
        run: |
          $taskTemp = Join-Path $env:GITHUB_WORKSPACE '.ci-temp'
          New-Item -ItemType Directory -Force $taskTemp | Out-Null
          $artifact = Join-Path $taskTemp 'mcr-2.0.1.jar'
          Invoke-WebRequest -Uri 'https://github.com/EllanServer/mahjong-mcr-java/releases/download/v2.0.1/mcr-rule-pack-2.0.1.jar' -OutFile $artifact -MaximumRetryCount 3 -ConnectionTimeoutSeconds 180
          if ((Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e07b7e3db3643826fd591fd23a5c985e17b30151efda29b0f41d24085ef20cd1') {
            throw 'Official MCR artifact checksum mismatch'
          }
          "RULE_PACK_ARTIFACT=$artifact" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$taskTemp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$taskTemp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify the pinned Riichi code and resource candidate
        shell: pwsh
        run: |
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'distribution/riichi/2.0.2'
          $code = Join-Path $candidate 'riichi-rule-pack-2.0.2.jar'
          $resources = Join-Path $candidate 'riichi-resource-pack-2.0.2.zip'
          if ((Get-FileHash $code -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4ee3962503c0f418202af7eb8c35a1a6f4e7ee723ec31e1c3a765020597c70eb') { throw 'Riichi code checksum mismatch' }
          if ((Get-FileHash $resources -Algorithm SHA256).Hash.ToLowerInvariant() -ne '42b35c1cdbdf0020f21bb82304c548d05aa675bc1472543ab23843174bd2db15') { throw 'Riichi resource checksum mismatch' }
          "RIICHI_RULE_PACK_ARTIFACT=$code" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RIICHI_RESOURCE_PACK_ARTIFACT=$resources" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build, test and verify the plugin
        shell: pwsh
        run: |
          $gradleArgs = @('build', '--no-daemon', '--stacktrace', "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64,$env:JAVA_HOME_25_X64", '-Porg.gradle.java.installations.auto-download=false')
          if ($IsWindows) {
            & ./gradlew.bat @gradleArgs
          } else {
            chmod +x ./gradlew
            & ./gradlew @gradleArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload plugin and source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MahjongPaper-lophine-26.3-${{ matrix.os }}
          path: modules/mahjong-plugin/build/libs/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lophine-test-reports-${{ matrix.os }}
          path: modules/*/build/reports/tests/**
          if-no-files-found: ignore
